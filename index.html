<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وصّل - WASSAL | نظام إدارة عمليات التوصيل</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'] },
                    colors: {
                        obsidian: '#090D16',
                        slateDark: '#111827',
                        slateCard: '#182234',
                        slateHover: '#1F2C44',
                        slateBorder: '#26334D',
                        wassalOrange: '#FF6B00',
                        wassalAmber: '#FF9E2C',
                        statusPicked: '#F59E0B',
                        statusOnway: '#38BDF8',
                        statusDone: '#10B981'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #090D16; color: #F8FAFC; }
        .wassal-grad { background: linear-gradient(135deg, #FF6B00 0%, #FF9E2C 100%); }
        .wassal-grad-hover:hover { background: linear-gradient(135deg, #E65F00 0%, #F58F1D 100%); }
        .glass-panel { background: rgba(17, 24, 39, 0.88); backdrop-filter: blur(12px); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090D16; }
        ::-webkit-scrollbar-thumb { background: #26334D; border-radius: 999px; }
        ::-webkit-scrollbar-thumb:hover { background: #FF6B00; }
        @media print {
            body { background: #ffffff !important; color: #000000 !important; }
            #sidebar, header, #kpi-ribbon, .no-print { display: none !important; }
            main { margin: 0 !important; padding: 0 !important; }
            .bg-slateDark, .bg-slateCard, .bg-obsidian { background: #ffffff !important; color: #000000 !important; border-color: #cccccc !important; }
            .text-white, .text-slate-200, .text-slate-300, .text-slate-400 { color: #000000 !important; }
        }
    </style>
</head>
<body class="font-sans antialiased selection:bg-wassalOrange selection:text-white overflow-x-hidden">

    <!-- MOBILE HEADER -->
    <div class="lg:hidden sticky top-0 z-30 glass-panel border-b border-slateBorder px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
            <!-- Mini SVG Logo for Mobile -->
            <div class="w-10 h-10 rounded-xl bg-obsidian border border-wassalOrange/40 flex items-center justify-center shadow-lg shadow-orange-500/15 shrink-0">
                <svg class="w-8 h-6" viewBox="0 0 260 115" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="mobGrad" x1="0" y1="0" x2="260" y2="115" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FF6200"/>
                            <stop offset="100%" stop-color="#FFA800"/>
                        </linearGradient>
                    </defs>
                    <path d="M12 36 L82 32 L78 42 L12 36 Z" fill="url(#mobGrad)"/>
                    <path d="M25 54 L88 50 L84 60 L25 54 Z" fill="url(#mobGrad)"/>
                    <path d="M74 28 C86 27 95 34 99 46 L112 84 L136 45 C140 39 148 39 152 45 L174 84 L196 36 L212 46 L186 98 C181 107 169 107 164 98 L144 62 L122 98 C117 107 104 107 100 98 L82 46 C79 38 74 35 66 34 Z" fill="url(#mobGrad)"/>
                    <path d="M222 10 C205 10 192 23 192 40 C192 59 222 86 222 86 C222 86 252 59 252 40 C252 23 239 10 222 10 Z" fill="url(#mobGrad)"/>
                    <circle cx="222" cy="39" r="11" fill="#FFFFFF"/>
                </svg>
            </div>
            <div>
                <h1 class="font-black text-base leading-none text-white">وصّل <span class="text-wassalOrange text-xs font-extrabold">WASSAL</span></h1>
                <div class="flex items-center gap-1.5 mt-1">
                    <span id="mobile-sync-dot" class="w-1.5 h-1.5 rounded-full bg-wassalAmber animate-pulse"></span>
                    <span id="mobile-sync-text" class="text-[10px] text-slate-400 font-bold">يوم: <strong id="mobile-active-day" class="text-white">--</strong></span>
                </div>
            </div>
        </div>
        <button type="button" data-action="toggle-sidebar" class="p-2 rounded-xl bg-slateCard border border-slateBorder text-slate-200 hover:text-wassalOrange">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
    </div>

    <!-- SIDEBAR BACKDROP -->
    <div id="sidebar-backdrop" data-action="toggle-sidebar" class="fixed inset-0 bg-black/70 z-30 hidden lg:hidden"></div>

    <!-- FIXED RIGHT SIDEBAR -->
    <aside id="sidebar" class="fixed top-0 right-0 z-40 h-screen w-72 bg-slateDark border-l border-slateBorder flex flex-col justify-between transition-transform duration-300 translate-x-full lg:translate-x-0">
        <div class="p-5 space-y-5 overflow-y-auto">
            <!-- Brand Identity (Full Coded SVG Logo matching original artwork) -->
            <div class="pb-4 border-b border-slateBorder flex flex-col items-center text-center select-none" dir="ltr">
                <!-- W + Speed Lines + Location Pin + Shadda Emblem -->
                <svg class="w-52 h-24 drop-shadow-[0_6px_14px_rgba(255,107,0,0.28)]" viewBox="0 0 270 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="wMainGrad" x1="15" y1="15" x2="255" y2="115" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FFA800"/>
                            <stop offset="55%" stop-color="#FF6B00"/>
                            <stop offset="100%" stop-color="#E54D00"/>
                        </linearGradient>
                        <linearGradient id="wShadowGrad" x1="90" y1="40" x2="180" y2="105" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#C23B00"/>
                            <stop offset="100%" stop-color="#FF7A00"/>
                        </linearGradient>
                    </defs>

                    <!-- Top Speed Streak -->
                    <path d="M10 38 L88 30 L85 41 L10 38 Z" fill="url(#wMainGrad)"/>
                    <!-- Middle Speed Streak -->
                    <path d="M24 55 L92 48 L89 58 L24 55 Z" fill="url(#wMainGrad)"/>
                    <!-- Bottom Speed Streak -->
                    <path d="M42 71 L97 65 L95 74 L42 71 Z" fill="url(#wMainGrad)"/>

                    <!-- W Folded Ribbon Back Segments (for 3D depth) -->
                    <path d="M138 44 L112 96 L124 102 L150 50 Z" fill="url(#wShadowGrad)"/>
                    <path d="M196 34 L168 96 L180 102 L208 42 Z" fill="url(#wShadowGrad)"/>

                    <!-- W Main Continuous Ribbon -->
                    <path d="M72 30 C86 29 96 36 101 49 L116 92 L139 46 C143 38 153 38 157 46 L176 92 L198 34 L212 43 L186 100 C181 109 169 109 164 100 L148 63 L127 100 C122 109 109 109 105 100 L85 48 C81 39 76 36 68 35 Z" fill="url(#wMainGrad)"/>

                    <!-- Small Orange Shadda (ّ) tucked under the W valley -->
                    <path d="M135 111 C135 116 141 116 141 111 L141 107 L144 107 L144 111 C144 116 150 116 150 111 L150 107 L154 107 L154 112 C154 119 146 121 142.5 117 C139 121 131 119 131 112 L131 107 L135 107 Z" fill="url(#wMainGrad)"/>

                    <!-- Location Pin on Top Right -->
                    <path d="M225 8 C207 8 193 22 193 39.5 C193 60 225 88 225 88 C225 88 257 60 257 39.5 C257 22 243 8 225 8 Z" fill="url(#wMainGrad)"/>
                    <circle cx="225" cy="39" r="11.5" fill="#FFFFFF"/>
                </svg>

                <!-- WASSAL English Wordmark (SS in Orange, rest in White, Italic Bold) -->
                <div class="font-black italic text-[28px] tracking-wider leading-none -mt-1">
                    <span class="text-white">WA</span><span class="text-transparent bg-clip-text bg-gradient-to-b from-[#FFA800] to-[#FF6200]">SS</span><span class="text-white">AL</span>
                </div>

                <!-- وصّل Arabic Wordmark with Orange Shadda & Side Lines -->
                <div class="flex items-center justify-center gap-2.5 w-full mt-1" dir="rtl">
                    <span class="h-[2.5px] w-9 bg-gradient-to-l from-[#FF6B00] to-[#FFA800] rounded-full"></span>
                    <span class="relative text-white font-black text-2xl leading-none tracking-tight">
                        وص<span class="relative inline-block">ل<span class="absolute -top-2.5 right-0.5 text-[#FF7A00] text-sm font-black">ّ</span></span>
                    </span>
                    <span class="h-[2.5px] w-9 bg-gradient-to-r from-[#FF6B00] to-[#FFA800] rounded-full"></span>
                </div>

                <!-- Slanted Orange Slogan Banner + Two Diagonal Bars on the Left -->
                <div class="mt-2.5 flex items-center justify-center gap-1.5" dir="rtl">
                    <div class="wassal-grad text-obsidian font-black text-xs px-4 py-1 rounded-sm -skew-x-12 shadow-md shadow-orange-500/25">
                        <span class="inline-block skew-x-12">وصّل .. هتشوف الفرق</span>
                    </div>
                    <span class="w-1.5 h-6 wassal-grad rounded-[1px] -skew-x-12"></span>
                    <span class="w-1.5 h-6 wassal-grad rounded-[1px] -skew-x-12"></span>
                </div>
            </div>

            <!-- Active Shift Day & Cloud Status -->
            <div class="space-y-2">
                <div class="bg-obsidian/90 border border-wassalOrange/40 rounded-xl px-3 py-2 flex items-center justify-between">
                    <span class="text-[11px] text-slate-400 font-bold">📅 اليوم المفتوح:</span>
                    <span id="sidebar-active-day" class="text-xs font-black text-wassalOrange font-mono">----/--/--</span>
                </div>
                <div class="bg-obsidian/90 border border-slateBorder rounded-xl px-3 py-2 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span id="desktop-sync-dot" class="w-2 h-2 rounded-full bg-wassalAmber animate-pulse"></span>
                        <span id="desktop-sync-text" class="text-[11px] font-black text-slate-300 tracking-wide">جاري الاتصال بالسحابة...</span>
                    </div>
                </div>
            </div>

            <!-- Primary CTA -->
            <button type="button" data-action="open-new-order" class="w-full wassal-grad wassal-grad-hover text-obsidian font-black py-3 px-4 rounded-xl shadow-lg shadow-orange-500/20 flex items-center justify-center gap-2 transition-all active:scale-[0.99]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                <span>تسجيل أوردر جديد</span>
            </button>

            <!-- Navigation Links -->
            <nav class="space-y-1.5">
                <button type="button" data-action="switch-tab" data-tab="operations" id="tab-btn-operations" class="nav-tab w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-extrabold wassal-grad text-obsidian shadow-lg shadow-orange-500/20 transition-all">
                    <span class="flex items-center gap-2.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"/></svg>
                        غرفة العمليات (الجاري)
                    </span>
                    <span id="nav-badge-active" class="px-2 py-0.5 text-xs rounded-full bg-obsidian/20 font-black">0</span>
                </button>

                <button type="button" data-action="switch-tab" data-tab="archive" id="tab-btn-archive" class="nav-tab w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-bold text-slate-300 hover:text-white hover:bg-slateCard transition-all">
                    <span class="flex items-center gap-2.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>
                        الأرشيف وإقفال اليوم
                    </span>
                    <span id="nav-badge-settled" class="px-2 py-0.5 text-xs rounded-full bg-statusDone/15 text-statusDone font-extrabold">0</span>
                </button>

                <button type="button" data-action="switch-tab" data-tab="riders" id="tab-btn-riders" class="nav-tab w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-bold text-slate-300 hover:text-white hover:bg-slateCard transition-all">
                    <span class="flex items-center gap-2.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        <span id="nav-label-riders">المناديب والموتوسيكلات</span>
                    </span>
                    <span id="nav-badge-riders" class="px-2 py-0.5 text-xs rounded-full bg-slateCard text-slate-300 font-extrabold">0/0</span>
                </button>

                <button type="button" data-action="switch-tab" data-tab="stores" id="tab-btn-stores" class="nav-tab w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-bold text-slate-300 hover:text-white hover:bg-slateCard transition-all">
                    <span class="flex items-center gap-2.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                        المتاجر الأكثر عملاً
                    </span>
                    <span id="nav-badge-stores" class="px-2 py-0.5 text-xs rounded-full bg-slateCard text-slate-300 font-extrabold">0</span>
                </button>

                <button type="button" data-action="switch-tab" data-tab="accounting" id="tab-btn-accounting" class="nav-tab w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-bold text-slate-300 hover:text-white hover:bg-slateCard transition-all">
                    <span class="flex items-center gap-2.5">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                        المحاسبة والمصروفات
                    </span>
                    <span id="nav-badge-profit" class="px-2 py-0.5 text-[11px] rounded-full bg-statusDone/15 text-statusDone font-extrabold">0 ج.م</span>
                </button>
            </nav>
        </div>

        <!-- Fleet Quick Summary Footer -->
        <div class="p-4 border-t border-slateBorder space-y-2.5 bg-obsidian/50">
            <div class="bg-slateCard border border-slateBorder rounded-xl p-3 space-y-2">
                <div class="flex items-center justify-between text-xs">
                    <span id="sidebar-fleet-title" class="text-slate-400 font-bold">جاهزية الأسطول</span>
                    <span id="sidebar-fleet-pct" class="font-black text-statusDone">0%</span>
                </div>
                <div class="w-full h-2 bg-obsidian rounded-full overflow-hidden">
                    <div id="sidebar-fleet-bar" class="h-full bg-statusDone rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <div class="flex justify-between text-[11px] text-slate-400">
                    <span id="sidebar-office-txt" class="text-statusDone font-bold">● 0 بالمكتب</span>
                    <span id="sidebar-busy-txt" class="text-statusOnway font-bold">● 0 في مهمة</span>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-1.5">
                <button type="button" data-action="open-close-day-modal" class="py-2 px-2 rounded-lg bg-wassalOrange/15 hover:bg-wassalOrange text-wassalOrange hover:text-obsidian border border-wassalOrange/40 text-[11px] font-black transition-colors">
                    🔒 إقفال اليوم
                </button>
                <button type="button" data-action="reset-demo" class="py-2 px-2 rounded-lg bg-slateCard hover:bg-slateHover border border-slateBorder text-[11px] text-slate-400 hover:text-white font-bold transition-colors">
                    تصفير البيانات
                </button>
            </div>
        </div>
    </aside>

    <!-- MAIN WORKSPACE -->
    <main class="lg:mr-72 min-h-screen flex flex-col">
        <!-- Top Bar -->
        <header class="sticky top-0 z-20 glass-panel border-b border-slateBorder px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-3">
            <div>
                <h2 id="header-title" class="font-black text-lg sm:text-xl text-white">غرفة العمليات ومتابعة الطلبات الجارية</h2>
                <p id="header-subtitle" class="text-xs text-slate-400">تم الاستلام ➔ تحرك للعميل ➔ تم التسليم (أو مرتجع) ➔ تم التوريد والعودة</p>
            </div>

            <div class="flex items-center gap-2.5 flex-1 sm:flex-initial justify-end">
                <div class="relative flex-1 sm:w-64">
                    <input id="search-input" type="text" placeholder="ابحث برقم الطلب، العميل، المندوب..." class="w-full bg-slateDark border border-slateBorder rounded-xl pr-9 pl-3 py-2 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-wassalOrange transition-colors">
                    <svg class="w-4 h-4 text-slate-400 absolute right-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>

                <div class="hidden md:flex items-center gap-2 bg-slateDark border border-slateBorder px-3 py-2 rounded-xl text-xs">
                    <span class="w-2 h-2 rounded-full bg-statusDone animate-ping"></span>
                    <span id="live-clock" class="font-extrabold text-slate-200 tracking-wide">--:--</span>
                </div>
            </div>
        </header>

        <!-- 5-CARD EXECUTIVE KPI RIBBON -->
        <section id="kpi-ribbon" class="px-4 sm:px-6 pt-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3.5">
            <!-- 1. Today & Month Orders -->
            <div class="bg-slateDark border border-slateBorder rounded-2xl p-4 flex flex-col justify-between">
                <div class="flex items-center justify-between">
                    <span class="text-xs text-slate-400 font-bold">أوردرا
